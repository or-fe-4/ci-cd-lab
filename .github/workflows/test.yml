# このワークフローの名前(GitHubのActions画面に表示される)
name: Run Tests

# 実行されるタイミングの定義
on:
  push:
    # mainブランチにpushされたときだけ実行する
    branches: [main]

# 実行する作業の集まり
jobs:
  # "test"という名前のジョブ(複数ジョブを並列実行することもできる)
  test:
    # GitHubが用意する仮想マシンの種類(最新のUbuntu)
    runs-on: ubuntu-latest

    # 実行する手順を順番に並べたもの
    steps:
      # GitHubのリポジトリの中身を仮想マシンにダウンロードする
      - uses: actions/checkout@v4

      # Python実行環境をセットアップする
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pytestをインストールする
      - name: Install dependencies
        run: pip install pytest

      # 実際にテストを実行する
      - name: Run tests
        run: pytest
